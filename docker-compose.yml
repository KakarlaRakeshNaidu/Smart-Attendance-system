services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  face-api:
    build: ./student-attendance-system/server/python
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/attendance_system
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy
  backend:
    build: ./student-attendance-system/server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/attendance_system
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET in your environment or Docker env file}
      JWT_EXPIRES_IN: 7d
      FACE_API_URL: http://face-api:5001/api
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      face-api:
        condition: service_started
  frontend:
    build: ./student-attendance-system/client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - backend
volumes:
  mongo-data:
  uploads:
